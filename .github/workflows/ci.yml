name: CI

on:
  # 브랜치 전략(CLAUDE.md): main · dev · feature/* + 실습 브랜치(fastcampus-intro)
  push:
    branches: [main, dev, "feature/**", fastcampus-intro]
  pull_request:
  # Actions 탭의 "Run workflow" 버튼으로 수동 실행
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # 1. 코드 받아오기
      - uses: pnpm/action-setup@v4 # 2. pnpm 설치
        with:
          version: 12 #    로컬 pnpm 버전에 맞춤 (pnpm -v → 12.x)
      - uses: actions/setup-node@v4 # 3. Node.js 설치
        with:
          node-version: 24 #    로컬 Node 버전에 맞춤 (node -v → v24.x)
          cache: pnpm #    의존성을 캐시해서 더 빠르게
      - run: pnpm install # 4. 의존성 설치 (CI에서는 lockfile 그대로만 설치)
      - name: 린트 검사 # 5. 01-linter
        run: pnpm lint
      - name: 테스트 실행 # 6. 02-testing (watch 모드 X, 한 번만 실행)
        run: pnpm exec vitest run
